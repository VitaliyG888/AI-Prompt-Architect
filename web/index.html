<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>AI Prompt Architect</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">К содержимому</a>
    <div id="app" class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7">
              <path d="M4 7l8-4 8 4-8 4-8-4z" stroke-linejoin="round" />
              <path d="M4 12l8 4 8-4M4 17l8 4 8-4" stroke-linejoin="round" opacity=".65" />
            </svg>
          </span>
          <div class="brand-text">
            <strong>AI Prompt Architect</strong>
            <span>интервью → исследование → синтез</span>
          </div>
        </div>

        <nav class="nav" aria-label="Основная навигация">
          <a class="nav-item" href="#/" data-nav="home">
            <span class="nav-icon" aria-hidden="true">◆</span> Проекты
          </a>
          <a class="nav-item" href="#/new" data-nav="new">
            <span class="nav-icon" aria-hidden="true">+</span> Новый промт
          </a>
          <a class="nav-item" href="#/settings" data-nav="settings">
            <span class="nav-icon" aria-hidden="true">⚙</span> Настройки
          </a>
        </nav>

        <div class="sidebar-footer" id="sidebar-status">
          <div class="status-dot" data-status="unknown"></div>
          <span>Проверка окружения…</span>
        </div>
      </aside>

      <main id="main" class="main" tabindex="-1"></main>
    </div>

    <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
